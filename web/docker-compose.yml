# Website + Caddy (HTTPS otomatis dari Let's Encrypt).
# Jalankan: docker compose up -d --build
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Isi NEXT_PUBLIC_SITE_URL di .env}
        NEXT_PUBLIC_GOOGLE_MAPS_EMBED_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_EMBED_KEY:-}
    image: klinik-mst-web
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/klinik.db
      MEDIA_DIR: /app/media
    volumes:
      - klinik-data:/app/data
      - klinik-media:/app/media
    expose:
      - '3000'
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - web
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Isi SITE_DOMAIN di .env, contoh bintangusadabakti.com}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  klinik-data:
  klinik-media:
  caddy-data:
  caddy-config:
