# Website + Caddy (HTTPS otomatis dari Let's Encrypt).
# Build di server ini      : docker compose up -d --build
# Pakai image jadi (GHCR)  : isi WEB_IMAGE di .env, lalu docker compose pull web && docker compose up -d --no-build
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Isi NEXT_PUBLIC_SITE_URL di .env}
        NEXT_PUBLIC_GOOGLE_MAPS_EMBED_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_EMBED_KEY:-}
    image: ${WEB_IMAGE:-klinik-mst-web}
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/klinik.db
      MEDIA_DIR: /app/media
    volumes:
      - klinik-data:/app/data
      - klinik-media:/app/media
    expose:
      - '3000'
    # Batas sumber daya agar tidak mengganggu aplikasi lain di VPS yang sama (pemakaian normal ±300 MB).
    mem_limit: ${WEB_MEM_LIMIT:-1g}
    cpus: ${WEB_CPUS:-1.5}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - web
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Isi SITE_DOMAIN di .env, contoh bintangusadabakti.com}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 256m
    restart: unless-stopped

volumes:
  klinik-data:
  klinik-media:
  caddy-data:
  caddy-config:
