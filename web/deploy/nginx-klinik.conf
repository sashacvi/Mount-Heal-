# Contoh server block Nginx (bila tidak memakai Caddy). HTTPS: jalankan certbot --nginx setelahnya.
server {
    listen 80;
    server_name bintangusadabakti.com www.bintangusadabakti.com;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3010;   # samakan dengan WEB_HOST_PORT di .env
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
